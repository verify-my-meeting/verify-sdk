openapi: 3.1.0
info:
  title: VerifyMyMeeting API
  version: '2.0'
  description: |
    Meeting attestation infrastructure. Each workspace keeps one linear,
    append-only chain of commits; a commit names a tree of documents (each
    an RFC 6962 Merkle tree with a provenance declaration), its parent,
    author, time, and message. Participants sign attendance, record approval
    (naming a commit, with a witness statement per document), and
    disclosure attestations with per-workspace Ed25519 keys and a Cubid
    humanity-score snapshot; batches of attestation hashes and commit hashes
    are anchored to OpenTimestamps.

    Authentication: `Authorization: Bearer vmm_sk_...` (integrator API key,
    acting as the integrator) or `Bearer vmm_ct_...` (consent token, acting on
    behalf of the owner who approved the integrator). Verification pages,
    receipts, and batches are readable without credentials. Attestation and
    withdrawal are available only to a signed-in participant in the
    VerifyMyMeeting web application and are therefore not in this document.

    vCon: every workspace commit is also an IETF vCon
    (`draft-ietf-vcon-vcon-core-05`, syntax `0.5.0`, spec sections 14 and
    15), exported signed by the service key as a JWS General JSON
    Serialization, unsigned, or gzipped, and imported from a vCon or an
    email thread. The signing keys are a JWK Set at
    `/.well-known/jwks.json`.

    Errors use one shape: `{ "error": { "code", "message", "details?" } }`.
    Every response carries `x-request-id`, `ratelimit-limit`,
    `ratelimit-remaining`, and `ratelimit-reset` headers.
servers:
  - url: https://verifymymeeting.com
    description: Production (placeholder hostname)
security:
  - bearer: []
tags:
  - name: workspaces
  - name: records
  - name: commits
  - name: invitations
  - name: participants
  - name: attestations
  - name: verification
  - name: anchoring
  - name: account
  - name: oauth
  - name: vcon

paths:
  /api/v1/workspaces:
    get:
      tags: [workspaces]
      summary: List workspaces owned by the caller
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [workspaces]
      summary: Create a workspace
      description: Requires good standing. Consent tokens need the `workspaces:write` scope.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '200':
          description: Created workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - name: key
        in: query
        description: Link token presented by a link holder
        schema: { type: string }
    get:
      tags: [workspaces]
      summary: Get a workspace
      description: Owners receive the full detail; other callers receive a glimpse at their access level.
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Workspace detail or glimpse
          content:
            application/json:
              schema:
                oneOf:
                  - { $ref: '#/components/schemas/WorkspaceDetail' }
                  - { $ref: '#/components/schemas/WorkspaceGlimpse' }
        default: { $ref: '#/components/responses/Error' }
    patch:
      tags: [workspaces]
      summary: Update workspace metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkspaceInput' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }
    delete:
      tags: [workspaces]
      summary: Delete a workspace
      description: Deletes records, profiles, and invitations and tombstones every attestation. Commitments remain.
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties: { deleted: { type: boolean, const: true } }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/status:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [workspaces]
      summary: Change lifecycle status
      description: Allowed transitions are draft to open, open to closed, closed to open.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/WorkspaceStatus' }
      responses:
        '200':
          description: Updated workspace
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Workspace' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/visibility:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [workspaces]
      summary: Change visibility
      description: |
        Moving to `public` requires `acknowledgement` to equal exactly
        "I understand that public pages are permanent". The first move away
        from private returns the link token once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visibility]
              properties:
                visibility: { $ref: '#/components/schemas/Visibility' }
                acknowledgement: { type: string }
      responses:
        '200':
          description: Updated workspace and, when first created, the link token
          content:
            application/json:
              schema:
                type: object
                required: [workspace, linkToken]
                properties:
                  workspace: { $ref: '#/components/schemas/Workspace' }
                  linkToken: { type: [string, 'null'] }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/link:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    post:
      tags: [workspaces]
      summary: Rotate the link token
      description: Previous link-visible URLs stop working.
      responses:
        '200':
          description: New link token
          content:
            application/json:
              schema:
                type: object
                required: [linkToken]
                properties: { linkToken: { type: string } }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/vcon:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - { $ref: '#/components/parameters/VconCommit' }
      - { $ref: '#/components/parameters/VconForm' }
    get:
      tags: [vcon]
      summary: Export a workspace as a vCon (owner level)
      description: |
        The owner-level vCon of one commit (the head by default) as rendered
        and stored at commit time (spec section 15). Requires the owner
        session, an integrator API key, or a consent token with
        `workspaces:read`.

        The form is chosen by `Accept` or by the `form` query parameter:
        `application/jose+json` (`signed`, the default) is the JWS General
        JSON Serialization signed by the service key; `application/vcon+json`
        (`unsigned`) is the payload alone; `application/gzip` (`gzip`) is the
        signed JSON compressed. The response carries
        `Content-Disposition: attachment; filename="<workspace-slug>-<seq>.vcon.jws"`
        (`.vcon.json` unsigned, `.vcon.jws.gz` gzip).
      security: [{ bearer: [] }]
      responses:
        '200':
          description: The vCon in the requested form
          headers:
            Content-Disposition:
              schema: { type: string }
              description: '`attachment; filename="<workspace-slug>-<seq>.vcon.jws"`, `.vcon.json`, or `.vcon.jws.gz`'
          content:
            application/jose+json:
              schema: { $ref: '#/components/schemas/SignedVcon' }
            application/vcon+json:
              schema: { $ref: '#/components/schemas/Vcon' }
            application/gzip:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/records:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [records]
      summary: List documents at the head commit (owner)
      responses:
        '200':
          description: Records
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/RecordSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [records]
      summary: Add or replace one document as one commit
      description: |
        Sugar for `POST /commits` with a single document. `link`: URL with
        an optional digest. `hash`: digest only. Digests are SHA-512 (128
        hex) unless `hashAlg` is `sha256` (64 hex). `text`: UTF-8 plain text or
        Markdown, segmented into Merkle leaves (segmentation v1). Link and
        hash records are single-leaf trees over the digest. `provenance` is
        required; `documentId` replaces an existing document with a new
        version. Rejected when the workspace is closed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordInput' }
      responses:
        '200':
          description: The record (document version) and the commit it created
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: '#/components/schemas/RecordSummary' }
                  - type: object
                    required: [commit]
                    properties:
                      commit: { $ref: '#/components/schemas/CommitSummary' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/commits:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - name: key
        in: query
        schema: { type: string }
    get:
      tags: [commits]
      summary: Commit history
      description: Every commit of the workspace chain in order, readable at any access level above none.
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Commits
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CommitSummary' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [commits]
      summary: Create a commit
      description: |
        Add or replace documents and/or remove documents in one commit on
        the workspace chain. Commits are append-only and linear; the kind is
        derived (`initial`, `add-document`, `edit`, `remove-document`).
        Commits after participants have attested are allowed; their approvals
        stay on the commit they signed. Owners and integrators only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CommitInput' }
      responses:
        '200':
          description: The new head commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitSummary' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/commits/{hash}:
    parameters:
      - { $ref: '#/components/parameters/CommitHash' }
      - name: key
        in: query
        schema: { type: string }
    get:
      tags: [commits]
      summary: Read a commit with its hashed body
      description: Recompute `SHA-512(canonical)` and compare with `hashHex` to verify (spec section 12).
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Commit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitDetail' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/commits/{hash}/diff:
    parameters:
      - { $ref: '#/components/parameters/CommitHash' }
      - name: key
        in: query
        schema: { type: string }
    get:
      tags: [commits]
      summary: Difference from the parent commit
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Per-document changes by leaf hash
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CommitDiff' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/records/{recordId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: key
        in: query
        schema: { type: string }
    get:
      tags: [records]
      summary: Read a record with its leaves
      description: Segments are returned only when the caller's access level satisfies the record's content visibility.
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Record content
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordContent' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/invitations:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [invitations]
      summary: List invitations (owner)
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Invitation' }
        default: { $ref: '#/components/responses/Error' }
    post:
      tags: [invitations]
      summary: Create an invitation link
      description: Consent tokens need the `invitations:write` scope. The token and URL are returned once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvitationInput' }
      responses:
        '200':
          description: Invitation with its one-time token and URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/invitations/{invitationId}:
    parameters:
      - { $ref: '#/components/parameters/WorkspaceId' }
      - name: invitationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [invitations]
      summary: Revoke an invitation
      responses:
        '200':
          description: Revoked invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/invitations/{token}:
    parameters:
      - name: token
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [invitations]
      summary: Preview an invitation
      description: What the invitation page shows before sign-in.
      security: [{}]
      responses:
        '200':
          description: Preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationPreview' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/participants:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [participants]
      summary: List participants (owner)
      responses:
        '200':
          description: Participants
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Participant' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/{id}/attestations:
    parameters: [{ $ref: '#/components/parameters/WorkspaceId' }]
    get:
      tags: [attestations]
      summary: List attestations (owner)
      responses:
        '200':
          description: Attestations, append-only, including tombstones
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Attestation' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/verify/{key}:
    parameters:
      - name: key
        in: path
        required: true
        description: Public slug, link token (`lnk_...`), or workspace id for signed-in viewers
        schema: { type: string }
    get:
      tags: [verification]
      summary: Verification page
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Page model rendered at the caller's access level
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VerificationPage' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/verify/{key}/vcon:
    parameters:
      - name: key
        in: path
        required: true
        description: Public slug or link token (`lnk_...`), resolved as for `/api/v1/verify/{key}`
        schema: { type: string }
      - { $ref: '#/components/parameters/VconForm' }
    get:
      tags: [vcon]
      summary: Export a verification page as a vCon (viewer level)
      description: |
        The head commit's vCon rendered at the key's access level: a
        `redacted_from` of the owner-level document (spec section 15.5),
        where parties collapse to `anonymous` or the disclosed fields and
        undisclosed documents become hash-only entries. No credentials
        beyond the key. Same `form` / `Accept` selection and
        `Content-Disposition` as the owner-level export.
      security: [{}]
      responses:
        '200':
          description: The vCon in the requested form
          headers:
            Content-Disposition:
              schema: { type: string }
          content:
            application/jose+json:
              schema: { $ref: '#/components/schemas/SignedVcon' }
            application/vcon+json:
              schema: { $ref: '#/components/schemas/Vcon' }
            application/gzip:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/receipts/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [attestation, commit] }
      - name: id
        in: path
        required: true
        description: Attestation id, commit id, or commit hash (128 hex)
        schema: { type: string }
    get:
      tags: [anchoring]
      summary: Inclusion receipt
      security: [{}]
      responses:
        '200':
          description: Receipt and server-side verdict, or null when not yet anchored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReceiptResponse' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/batches:
    get:
      tags: [anchoring]
      summary: Transparency list of batches
      security: [{}]
      responses:
        '200':
          description: Batches and the service signing key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchList' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/batches/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [anchoring]
      summary: One batch
      security: [{}]
      responses:
        '200':
          description: Batch
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Batch' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/me:
    get:
      tags: [account]
      summary: Who am I
      security: [{}, { bearer: [] }]
      responses:
        '200':
          description: Credential summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/me/workspaces:
    get:
      tags: [account]
      summary: Workspaces the caller attested in
      description: |
        For consent tokens with the `participant:read` scope (and sessions).
        Integrators such as VerifyMyResearch use it to show a participant
        which studies include their meetings. Returns the caller's own
        handle per workspace and attestation flags; nothing about other
        participants.
      security: [{ bearer: [] }]
      responses:
        '200':
          description: Participation list
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required:
                        [
                          workspace,
                          participantId,
                          handleNumber,
                          handle,
                          joinedAt,
                          attendance,
                          approval,
                        ]
                      properties:
                        workspace:
                          type: object
                          properties:
                            id: { type: string, format: uuid }
                            title: { type: string }
                            scheduledStart:
                              {
                                type: string,
                                format: date-time,
                                nullable: true,
                              }
                            actualStart:
                              {
                                type: string,
                                format: date-time,
                                nullable: true,
                              }
                            durationMinutes: { type: integer, nullable: true }
                            timezone: { type: string }
                            status:
                              { type: string, enum: [draft, open, closed] }
                            visibility:
                              { type: string, enum: [private, link, public] }
                        participantId: { type: string, format: uuid }
                        handleNumber: { type: integer }
                        handle: { type: string }
                        joinedAt: { type: string, format: date-time }
                        attendance: { type: boolean }
                        approval: { type: boolean }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/workspaces/aggregate:
    post:
      tags: [workspaces]
      summary: Counts across workspaces the caller owns
      description: |
        Distinct participants (by VerifyMyMeeting's internal identity, never
        by handle), lowest score snapshot, withdrawals, and attestation
        counts across a set of workspaces. Workspaces the caller does not
        own are listed under `unavailable` and left out of the counts.
        Requires `workspaces:read` on a consent token.
      security: [{ bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [workspaceIds]
              properties:
                workspaceIds:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Aggregate counts
          content:
            application/json:
              schema:
                type: object
                required:
                  [
                    workspaces,
                    unavailable,
                    distinctParticipants,
                    lowestScore,
                    withdrawals,
                    attendanceAttestations,
                    recordApprovals,
                  ]
                properties:
                  workspaces:
                    { type: array, items: { type: string, format: uuid } }
                  unavailable:
                    { type: array, items: { type: string, format: uuid } }
                  distinctParticipants: { type: integer }
                  lowestScore: { type: number, nullable: true }
                  withdrawals: { type: integer }
                  attendanceAttestations: { type: integer }
                  recordApprovals: { type: integer }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/oauth/token:
    post:
      tags: [oauth]
      summary: Exchange an authorization code for a consent token
      description: |
        Final step of the OAuth 2.1 authorization-code flow with PKCE. The
        owner is first sent to `/connect/authorize?client_id&redirect_uri&state&code_challenge&code_challenge_method=S256&scope`
        on the VerifyMyMeeting web application and redirected back with `code`
        and `state`.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema: { $ref: '#/components/schemas/TokenRequest' }
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Consent token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        default: { $ref: '#/components/responses/Error' }

  /api/v1/vcon/import:
    post:
      tags: [vcon]
      summary: Import a vCon or an email thread
      description: |
        Create a workspace from a vCon, or commit a vCon's documents onto an
        existing workspace (spec section 15.7). Requires a session, an
        integrator API key, or a consent token with `workspaces:write`.

        Either a JSON body `{ vcon, workspaceId?, message? }` where `vcon`
        is the unsigned vCon object or a signed JWS General JSON
        Serialization, or a raw body under `Content-Type`
        `application/vcon+json` (unsigned), `application/jose+json`
        (signed), `message/rfc822` (one `.eml`) or `application/mbox` (a
        thread), with `workspaceId` and `message` as query parameters. Email
        is converted by the email adapter: `parties` from the headers, one
        text `dialog` entry per message.

        Without `workspaceId` a new workspace is created (title from
        `subject`). Parties become participant slots, `dialog` and
        `analysis` entries become documents with provenance derived from
        `type`, `vendor` and `product`, attachments become `evidence` or
        `other` documents, `url` + `content_hash` entries become `link`
        documents with the digest carried over; `sessions` and `events` are
        preserved, not interpreted. A `critical` extension token the server
        does not know is refused with `unsupported_extension` (400). A
        signed input is checked against the service keys and reported in
        `imported.signature`.
      security: [{ bearer: [] }]
      parameters:
        - name: workspaceId
          in: query
          description: For raw bodies; commit onto this workspace instead of creating one
          schema: { type: string, format: uuid }
        - name: message
          in: query
          description: For raw bodies; the commit message
          schema: { type: string, maxLength: 500 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VconImportInput' }
          application/vcon+json:
            schema: { $ref: '#/components/schemas/Vcon' }
          application/jose+json:
            schema: { $ref: '#/components/schemas/SignedVcon' }
          message/rfc822:
            schema: { type: string, description: One RFC 5322 message }
          application/mbox:
            schema: { type: string, description: An mbox file with the thread }
      responses:
        '200':
          description: The workspace, the commit, and what was imported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VconImportResult' }
        default: { $ref: '#/components/responses/Error' }

  /.well-known/jwks.json:
    get:
      tags: [vcon]
      summary: Service public keys
      description: |
        The JWK Set (RFC 7517) of the service keys that sign vCon exports:
        the current key and any retired keys, each `{ kty: "OKP", crv:
        "Ed25519", x, kid, use: "sig", alg: "EdDSA" }`. A signed export's
        protected header names its key by `kid`.
      security: []
      responses:
        '200':
          description: JWK Set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Jwks' }
        default: { $ref: '#/components/responses/Error' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: '`vmm_sk_...` integrator API key or `vmm_ct_...` consent token'
  parameters:
    CommitHash:
      name: hash
      in: path
      required: true
      schema: { type: string, pattern: '^[0-9a-fA-F]{128}$' }
    WorkspaceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    VconCommit:
      name: commit
      in: query
      description: Commit sequence number or commit hash (128 hex); the head commit by default
      schema:
        oneOf:
          - { type: integer, minimum: 1 }
          - { type: string, pattern: '^[0-9a-fA-F]{128}$' }
    VconForm:
      name: form
      in: query
      description: Overrides `Accept`; `signed` is the default
      schema: { type: string, enum: [signed, unsigned, gzip] }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ApiError' }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - unauthorized
                - forbidden
                - not_found
                - validation
                - conflict
                - limit_exceeded
                - standing_required
                - cubid_unavailable
                - rate_limited
                - feature_disabled
                - invalid_state
                - database_unavailable
                - unsupported_extension
                - internal
            message: { type: string }
            details: {}
    Visibility:
      type: string
      enum: [private, link, public]
    WorkspaceStatus:
      type: string
      enum: [draft, open, closed]
    AccessLevel:
      type: string
      enum: [none, public, link, viewer, owner]
    ContentVisibility:
      type: string
      enum: [public, link, viewer]
    Workspace:
      type: object
      required:
        [
          id,
          ownerAccountId,
          integratorId,
          title,
          description,
          purpose,
          scheduledStart,
          actualStart,
          durationMinutes,
          timezone,
          visibility,
          status,
          publicSlug,
          minScore,
          publicAckAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        ownerAccountId: { type: string, format: uuid }
        integratorId: { type: [string, 'null'], format: uuid }
        title: { type: string }
        description: { type: string }
        purpose: { type: string }
        scheduledStart: { type: [string, 'null'], format: date-time }
        actualStart: { type: [string, 'null'], format: date-time }
        durationMinutes: { type: [integer, 'null'] }
        timezone: { type: string }
        visibility: { $ref: '#/components/schemas/Visibility' }
        status: { $ref: '#/components/schemas/WorkspaceStatus' }
        publicSlug: { type: [string, 'null'] }
        minScore: { type: [number, 'null'] }
        publicAckAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceInput:
      type: object
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        purpose: { type: string, maxLength: 1000 }
        scheduledStart: { type: [string, 'null'], format: date-time }
        actualStart: { type: [string, 'null'], format: date-time }
        durationMinutes: { type: [integer, 'null'], minimum: 1, maximum: 10080 }
        timezone: { type: string, default: UTC }
        minScore: { type: [number, 'null'], minimum: 0 }
    WorkspaceGlimpse:
      type: object
      required: [workspace, level]
      properties:
        workspace:
          type: object
          required: [id, title, visibility, status]
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            visibility: { $ref: '#/components/schemas/Visibility' }
            status: { $ref: '#/components/schemas/WorkspaceStatus' }
        level: { $ref: '#/components/schemas/AccessLevel' }
    WorkspaceDetail:
      type: object
      required:
        [workspace, level, records, participants, invitations, attestations]
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        level: { $ref: '#/components/schemas/AccessLevel' }
        records:
          type: array
          items: { $ref: '#/components/schemas/RecordSummary' }
        participants:
          type: array
          items: { $ref: '#/components/schemas/Participant' }
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
        attestations:
          type: array
          items: { $ref: '#/components/schemas/Attestation' }
    Provenance:
      type: object
      description: Provenance declaration, committed with the document (spec section 13)
      required: [type, creators, created, ai]
      properties:
        type:
          {
            type: string,
            enum:
              [
                transcript,
                minutes,
                notes,
                recording,
                image,
                evidence,
                code,
                other,
              ],
          }
        creators:
          type: array
          minItems: 1
          items: { type: string, enum: [owner, participant, other-human] }
        created: { type: string, enum: [before, during, after] }
        ai: { type: string, enum: [none, assisted, generated] }
        aiRole:
          {
            type: string,
            enum: [verbatim, summary, enhanced],
            description: Required unless ai is none,
          }
        evidenceDocId:
          {
            type: string,
            format: uuid,
            description: An evidence document in the same package,
          }
        note: { type: string, maxLength: 280 }
    Witness:
      type: string
      description: What the participant personally vouches for about a document's origin
      enum:
        [
          author,
          witnessed,
          representative,
          inspired,
          verified-prior,
          told-by-participant,
          told-third-party,
          none,
        ]
    Grade:
      type: string
      enum: [A, B, C, ungraded]
    GradeResult:
      type: object
      required: [grade, cap, statements, mismatch]
      properties:
        grade: { $ref: '#/components/schemas/Grade' }
        cap: { $ref: '#/components/schemas/Grade' }
        statements:
          type: array
          items:
            type: object
            required: [witness, grade, mismatch]
            properties:
              witness: { $ref: '#/components/schemas/Witness' }
              grade: { $ref: '#/components/schemas/Grade' }
              mismatch: { type: boolean }
        mismatch: { type: boolean }
    LeafSet:
      description: '"all", "none" (explicit exclusion), or inclusive [start, end] index ranges'
      oneOf:
        - { const: all }
        - { const: none }
        - type: array
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
    TreeEntry:
      type: object
      required: [doc, kind, label, root, leafCount, segmentation, provenance]
      properties:
        doc: { type: string, format: uuid }
        kind: { type: string, enum: [link, hash, text] }
        label: { type: string }
        root: { type: string }
        leafCount: { type: integer }
        segmentation: { type: [string, 'null'] }
        provenance: { $ref: '#/components/schemas/Provenance' }
    CommitAuthor:
      type: object
      required: [role, ref]
      properties:
        role: { type: string, enum: [owner, integrator, participant] }
        ref: { type: [string, 'null'] }
    CommitBody:
      type: object
      description: The hashed object; tree sorted by doc (spec section 12)
      required: [v, workspace, seq, parent, kind, author, time, message, tree]
      properties:
        v: { const: 1 }
        workspace: { type: string, format: uuid }
        seq: { type: integer, minimum: 1 }
        parent: { type: [string, 'null'] }
        kind:
          {
            type: string,
            enum: [initial, edit, comment, add-document, remove-document],
          }
        author: { $ref: '#/components/schemas/CommitAuthor' }
        time: { type: string, format: date-time }
        message: { type: string }
        tree:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
    CommitSummary:
      type: object
      required:
        [
          id,
          workspaceId,
          seq,
          hashHex,
          parentHashHex,
          kind,
          author,
          message,
          committedAt,
          tree,
          documents,
          parentDocuments,
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        seq: { type: integer }
        hashHex: { type: string }
        parentHashHex: { type: [string, 'null'] }
        kind:
          {
            type: string,
            enum: [initial, edit, comment, add-document, remove-document],
          }
        author: { $ref: '#/components/schemas/CommitAuthor' }
        message: { type: string }
        committedAt: { type: string, format: date-time }
        tree:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
        documents:
          type: array
          description: Document id to record (version) id, in tree order
          items:
            type: object
            required: [documentId, recordId]
            properties:
              documentId: { type: string, format: uuid }
              recordId: { type: string, format: uuid }
        parentDocuments:
          type: array
          items: { type: string, format: uuid }
    CommitDetail:
      allOf:
        - { $ref: '#/components/schemas/CommitSummary' }
        - type: object
          required: [body, canonical]
          properties:
            body: { $ref: '#/components/schemas/CommitBody' }
            canonical: { type: string, description: RFC 8785 form of body }
    CommitInput:
      type: object
      properties:
        message: { type: string, maxLength: 500 }
        documents:
          type: array
          maxItems: 50
          items: { $ref: '#/components/schemas/DocumentInput' }
        remove:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }
    CommitDiff:
      type: object
      required: [commit, parent, documents]
      properties:
        commit: { $ref: '#/components/schemas/CommitSummary' }
        parent:
          oneOf:
            - { $ref: '#/components/schemas/CommitSummary' }
            - { type: 'null' }
        documents:
          type: array
          items:
            type: object
            required:
              [
                documentId,
                label,
                change,
                leaves,
                provenanceChanged,
                labelChanged,
              ]
            properties:
              documentId: { type: string, format: uuid }
              label: { type: string }
              change:
                { type: string, enum: [added, removed, modified, unchanged] }
              leaves:
                oneOf:
                  - type: object
                    required: [same, added, removed]
                    properties:
                      same: { type: integer }
                      added: { type: integer }
                      removed: { type: integer }
                  - { type: 'null' }
              provenanceChanged: { type: boolean }
              labelChanged: { type: boolean }
    RecordSummary:
      type: object
      description: One version of a document, committed as a Merkle tree
      required:
        [
          id,
          workspaceId,
          documentId,
          kind,
          label,
          url,
          hashHex,
          contentBytes,
          segmentationVersion,
          leafCount,
          rootHex,
          version,
          provenance,
          contentVisibility,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        documentId:
          {
            type: string,
            format: uuid,
            description: Stable across versions; named by trees and approvals,
          }
        kind: { type: string, enum: [link, hash, text] }
        label: { type: string }
        url: { type: [string, 'null'] }
        hashHex:
          { type: [string, 'null'], description: owner-supplied digest, hex }
        hashAlg:
          {
            type: [string, 'null'],
            enum: [sha512, sha256, null],
            description: algorithm of hashHex,
          }
        contentBytes: { type: integer }
        segmentationVersion: { type: [string, 'null'] }
        leafCount: { type: integer }
        rootHex: { type: string, description: RFC 6962 SHA-512 root }
        version: { type: integer }
        provenance:
          oneOf:
            - { $ref: '#/components/schemas/Provenance' }
            - { type: 'null' }
        contentVisibility: { $ref: '#/components/schemas/ContentVisibility' }
        createdAt: { type: string, format: date-time }
    DocumentInput:
      oneOf:
        - type: object
          required: [kind, url, provenance]
          properties:
            kind: { const: link }
            url: { type: string, format: uri }
            label: { type: string, maxLength: 200 }
            hashHex:
              { type: string, pattern: '^([0-9a-fA-F]{128}|[0-9a-fA-F]{64})$' }
            hashAlg: { type: string, enum: [sha512, sha256], default: sha512 }
            contentVisibility:
              { $ref: '#/components/schemas/ContentVisibility' }
            documentId: { type: string, format: uuid }
            provenance: { $ref: '#/components/schemas/Provenance' }
        - type: object
          required: [kind, label, hashHex, provenance]
          properties:
            kind: { const: hash }
            label: { type: string, minLength: 1, maxLength: 200 }
            hashHex:
              { type: string, pattern: '^([0-9a-fA-F]{128}|[0-9a-fA-F]{64})$' }
            hashAlg: { type: string, enum: [sha512, sha256], default: sha512 }
            contentVisibility:
              { $ref: '#/components/schemas/ContentVisibility' }
            documentId: { type: string, format: uuid }
            provenance: { $ref: '#/components/schemas/Provenance' }
        - type: object
          required: [kind, text, provenance]
          properties:
            kind: { const: text }
            text: { type: string, minLength: 1 }
            label: { type: string, maxLength: 200 }
            contentVisibility:
              { $ref: '#/components/schemas/ContentVisibility' }
            documentId: { type: string, format: uuid }
            provenance: { $ref: '#/components/schemas/Provenance' }
    RecordInput:
      allOf:
        - { $ref: '#/components/schemas/DocumentInput' }
        - type: object
          properties:
            message: { type: string, maxLength: 500 }
    RecordContent:
      type: object
      required: [record, segments, leaves]
      properties:
        record: { $ref: '#/components/schemas/RecordSummary' }
        segments:
          type: array
          items:
            type: object
            required: [index, text, leafHash]
            properties:
              index: { type: integer }
              text: { type: string }
              leafHash: { type: string }
        leaves:
          type: array
          items:
            type: object
            required: [index, leafHash]
            properties:
              index: { type: integer }
              leafHash: { type: string }
    Invitation:
      type: object
      required:
        [
          id,
          workspaceId,
          kind,
          label,
          maxUses,
          uses,
          expiresAt,
          revokedAt,
          createdAt,
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        kind: { type: string, enum: [slot, open, viewer] }
        label: { type: string }
        maxUses: { type: integer }
        uses: { type: integer }
        expiresAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    InvitationInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [slot, open, viewer] }
        label: { type: string, maxLength: 200 }
        maxUses: { type: integer, minimum: 1, maximum: 10000 }
    CreatedInvitation:
      type: object
      required: [invitation, token, url]
      properties:
        invitation: { $ref: '#/components/schemas/Invitation' }
        token: { type: string }
        url: { type: string, format: uri }
    InvitationPreview:
      type: object
      required: [usable, reason, kind, expiresAt, workspace, signedIn]
      properties:
        usable: { type: boolean }
        reason:
          { type: string, enum: [ok, revoked, expired, exhausted, closed] }
        kind: { type: string, enum: [slot, open, viewer] }
        expiresAt: { type: string, format: date-time }
        workspace:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            description: { type: string }
            purpose: { type: string }
            scheduledStart: { type: [string, 'null'], format: date-time }
            actualStart: { type: [string, 'null'], format: date-time }
            durationMinutes: { type: [integer, 'null'] }
            timezone: { type: string }
            status: { $ref: '#/components/schemas/WorkspaceStatus' }
            minScore: { type: [number, 'null'] }
        signedIn: { type: boolean }
    Participant:
      type: object
      required:
        [
          id,
          workspaceId,
          handleNumber,
          handle,
          joinedAt,
          withdrawnAt,
          keyId,
          publicKeyHex,
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        handleNumber: { type: integer }
        handle: { type: string, example: 'Person #4821' }
        joinedAt: { type: string, format: date-time }
        withdrawnAt: { type: [string, 'null'], format: date-time }
        keyId: { type: [string, 'null'] }
        publicKeyHex:
          { type: [string, 'null'], description: Raw Ed25519 public key, hex }
    ScoreSnapshot:
      type: object
      required: [value, schema, fetchedAt]
      properties:
        value: { type: number }
        schema: { type: string }
        fetchedAt: { type: string, format: date-time }
    Attestation:
      type: object
      required:
        [
          id,
          workspaceId,
          participantId,
          kind,
          commitId,
          payload,
          payloadHashHex,
          signatureB64,
          keyId,
          score,
          supersedesId,
          createdAt,
          tombstonedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        workspaceId: { type: string, format: uuid }
        participantId: { type: string, format: uuid }
        kind: { type: string, enum: [attendance, record, disclosure] }
        commitId:
          {
            type: [string, 'null'],
            format: uuid,
            description: The approved commit (record attestations),
          }
        payload:
          description: Signed payload (see spec/README.md); null for tombstones
          oneOf:
            - { $ref: '#/components/schemas/AttestationPayload' }
            - { type: 'null' }
        payloadHashHex:
          {
            type: [string, 'null'],
            description: SHA-512 of the RFC 8785 canonical payload,
          }
        signatureB64:
          {
            type: [string, 'null'],
            description: Ed25519 signature over payloadHash,
            base64,
          }
        keyId: { type: [string, 'null'] }
        score:
          oneOf:
            - { $ref: '#/components/schemas/ScoreSnapshot' }
            - { type: 'null' }
        supersedesId: { type: [string, 'null'], format: uuid }
        createdAt: { type: string, format: date-time }
        tombstonedAt: { type: [string, 'null'], format: date-time }
    AttestationPayload:
      type: object
      required: [v, workspace, handle, issuedAt, score, kind]
      properties:
        v: { const: 1 }
        workspace: { type: string, format: uuid }
        handle: { type: string }
        issuedAt: { type: string, format: date-time }
        score: { $ref: '#/components/schemas/ScoreSnapshot' }
        kind: { type: string, enum: [attendance, record, disclosure] }
        mode:
          { type: string, enum: [full, range], description: attendance only }
        from:
          {
            type: string,
            format: date-time,
            description: attendance range only,
          }
        to:
          {
            type: string,
            format: date-time,
            description: attendance range only,
          }
        commit: { type: string, description: record only; commit hash }
        seq: { type: integer, description: record only; commit sequence }
        approvals:
          description: record only; one entry per document of the commit
          type: array
          items:
            type: object
            required: [doc, root, leaves, witness]
            properties:
              doc: { type: string, format: uuid }
              root: { type: string }
              leaves: { $ref: '#/components/schemas/LeafSet' }
              witness: { $ref: '#/components/schemas/Witness' }
        public:
          {
            type: string,
            description: disclosure only; SHA-512 of the public profile,
          }
        viewer:
          {
            type: string,
            description: disclosure only; SHA-512 of the viewer profile,
          }
    ProfileFields:
      type: object
      description: |
        What a participant disclosed at a level. `displayName` and
        `affiliation` are self-declared; `identifiers` are Cubid-verified
        identifiers the participant chose to disclose, read from Cubid at
        disclosure time. Nothing the participant did not disclose appears.
      properties:
        displayName: { type: string }
        affiliation: { type: string }
        identifiers:
          type: array
          items: { $ref: '#/components/schemas/DisclosedIdentifier' }
    DisclosedIdentifier:
      type: object
      required: [kind, value, status, verifiedBy, syncedAt]
      properties:
        kind:
          type: string
          description: '`email`, `phone`, `name`, or a social account kind (`github`, ...)'
        value: { type: string }
        status: { const: verified }
        verifiedBy: { const: cubid }
        syncedAt:
          type: string
          format: date-time
          description: When the identifier was last read from Cubid
    VerificationParticipant:
      type: object
      required:
        [
          id,
          handle,
          joinedAt,
          withdrawn,
          keyId,
          publicKeyHex,
          score,
          attendance,
          approval,
          profile,
          profileUpdatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        handle: { type: string }
        joinedAt: { type: string, format: date-time }
        withdrawn: { type: boolean }
        keyId: { type: [string, 'null'] }
        publicKeyHex: { type: [string, 'null'] }
        score:
          oneOf:
            - { $ref: '#/components/schemas/ScoreSnapshot' }
            - { type: 'null' }
        attendance:
          oneOf:
            - { $ref: '#/components/schemas/Attestation' }
            - { type: 'null' }
        approval:
          oneOf:
            - type: object
              required:
                [
                  attestation,
                  commitId,
                  commitHashHex,
                  commitSeq,
                  current,
                  documents,
                ]
              properties:
                attestation: { $ref: '#/components/schemas/Attestation' }
                commitId: { type: string, format: uuid }
                commitHashHex: { type: string }
                commitSeq: { type: integer }
                current:
                  {
                    type: boolean,
                    description: False when later commits exist that this participant has not approved,
                  }
                documents:
                  type: array
                  items:
                    type: object
                    required: [documentId, leaves, witness]
                    properties:
                      documentId: { type: string, format: uuid }
                      leaves: { $ref: '#/components/schemas/LeafSet' }
                      witness: { $ref: '#/components/schemas/Witness' }
            - { type: 'null' }
        profile: { $ref: '#/components/schemas/ProfileFields' }
        profileUpdatedAt: { type: [string, 'null'], format: date-time }
    VerificationCommit:
      type: object
      required:
        [
          id,
          seq,
          hashHex,
          parentHashHex,
          kind,
          author,
          message,
          committedAt,
          tree,
        ]
      properties:
        id: { type: string, format: uuid }
        seq: { type: integer }
        hashHex: { type: string }
        parentHashHex: { type: [string, 'null'] }
        kind:
          {
            type: string,
            enum: [initial, edit, comment, add-document, remove-document],
          }
        author: { $ref: '#/components/schemas/CommitAuthor' }
        message: { type: string }
        committedAt: { type: string, format: date-time }
        tree:
          type: array
          items: { $ref: '#/components/schemas/TreeEntry' }
    VerificationPage:
      type: object
      required:
        [
          level,
          workspace,
          participants,
          withdrawnCount,
          head,
          commits,
          documents,
          anchoring,
          proves,
          doesNotProve,
        ]
      properties:
        level: { $ref: '#/components/schemas/AccessLevel' }
        workspace:
          type: object
          properties:
            id: { type: string, format: uuid }
            title: { type: string }
            description: { type: string }
            purpose: { type: string }
            scheduledStart: { type: [string, 'null'], format: date-time }
            actualStart: { type: [string, 'null'], format: date-time }
            durationMinutes: { type: [integer, 'null'] }
            timezone: { type: string }
            visibility: { $ref: '#/components/schemas/Visibility' }
            status: { $ref: '#/components/schemas/WorkspaceStatus' }
            publicSlug: { type: [string, 'null'] }
            minScore: { type: [number, 'null'] }
            createdAt: { type: string, format: date-time }
        participants:
          type: array
          items: { $ref: '#/components/schemas/VerificationParticipant' }
        withdrawnCount: { type: integer }
        head:
          oneOf:
            - { $ref: '#/components/schemas/VerificationCommit' }
            - { type: 'null' }
        commits:
          type: array
          items: { $ref: '#/components/schemas/VerificationCommit' }
        documents:
          description: Documents at the head commit
          type: array
          items:
            allOf:
              - { $ref: '#/components/schemas/RecordSummary' }
              - type: object
                required: [contentVisible, approvals, grade]
                properties:
                  contentVisible: { type: boolean }
                  approvals:
                    type: array
                    items:
                      type: object
                      required: [handle, leaves, witness]
                      properties:
                        handle: { type: string }
                        leaves: { $ref: '#/components/schemas/LeafSet' }
                        witness: { $ref: '#/components/schemas/Witness' }
                  grade:
                    description: Recomputed by the server; verifiers recompute it with gradeDocument()
                    $ref: '#/components/schemas/GradeResult'
        anchoring:
          type: object
          required: [anchored, pending, items]
          properties:
            anchored: { type: integer }
            pending: { type: integer }
            items:
              type: array
              items:
                type: object
                required: [itemKind, itemId, batchId, status]
                properties:
                  itemKind:
                    { type: string, enum: [attestation, record, commit] }
                  itemId: { type: string, format: uuid }
                  batchId: { type: string, format: uuid }
                  status: { $ref: '#/components/schemas/BatchStatus' }
        proves:
          type: array
          items: { type: string }
        doesNotProve:
          type: array
          items: { type: string }
    AuditStep:
      type: object
      required: [hash, side]
      properties:
        hash: { type: string }
        side: { type: string, enum: [left, right] }
    Receipt:
      type: object
      required: [v, batch, root, index, path, item, ledger, service]
      properties:
        v: { const: 1 }
        batch: { type: string, format: uuid }
        root: { type: string }
        index: { type: integer }
        path:
          type: array
          items: { $ref: '#/components/schemas/AuditStep' }
        item:
          type: object
          required: [kind, id, leafHash]
          properties:
            kind: { type: string, enum: [attestation, record, commit] }
            id: { type: string, format: uuid }
            leafHash: { type: string }
        ledger:
          type: object
          required: [kind, calendar, proof, status, submittedAt]
          properties:
            kind: { type: string, enum: [opentimestamps, none] }
            calendar: { type: [string, 'null'] }
            proof:
              {
                type: [string, 'null'],
                description: OpenTimestamps proof bytes,
                base64,
              }
            status:
              { type: string, enum: [submitted, confirmed, pending, failed] }
            submittedAt: { type: [string, 'null'], format: date-time }
        service:
          type: object
          required: [keyId, signature]
          properties:
            keyId: { type: [string, 'null'] }
            signature: { type: [string, 'null'] }
    ReceiptResponse:
      oneOf:
        - type: object
          required: [receipt, verdict]
          properties:
            receipt: { type: 'null' }
            verdict: { const: pending }
        - type: object
          required: [receipt, verdict, inclusion]
          properties:
            receipt: { $ref: '#/components/schemas/Receipt' }
            verdict: { type: string, enum: [valid, invalid, pending] }
            inclusion: { type: boolean }
    BatchStatus:
      type: string
      enum: [building, submitted, confirmed, failed]
    Batch:
      type: object
      required:
        [
          id,
          createdAt,
          rootHex,
          leafCount,
          ledgerKind,
          calendarUrl,
          status,
          submittedAt,
          confirmedAt,
          error,
          serviceSignatureB64,
          serviceKeyId,
        ]
      properties:
        id: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        rootHex: { type: string }
        leafCount: { type: integer }
        ledgerKind: { type: string }
        calendarUrl: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/BatchStatus' }
        submittedAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
        error: { type: [string, 'null'] }
        serviceSignatureB64:
          {
            type: [string, 'null'],
            description: 'Ed25519 over sha512("vmm-batch:<id>:<root>:<leafCount>")',
          }
        serviceKeyId: { type: [string, 'null'] }
    BatchList:
      type: object
      required: [serviceKey, items]
      properties:
        serviceKey:
          type: object
          required: [keyId, publicKeyHex]
          properties:
            keyId: { type: string }
            publicKeyHex: { type: string }
        items:
          type: array
          items: { $ref: '#/components/schemas/Batch' }
    Account:
      type: object
      required: [id, isOwner, isAdmin, createdAt, lastSeenAt, hasCubidUserId]
      properties:
        id: { type: string, format: uuid }
        isOwner: { type: boolean }
        isAdmin: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }
        hasCubidUserId: { type: boolean }
    Me:
      oneOf:
        - type: object
          required: [authenticated]
          properties:
            authenticated: { const: false }
        - type: object
          required: [authenticated, credential, integratorId]
          properties:
            authenticated: { const: true }
            credential: { type: string, enum: [api_key, consent] }
            integratorId: { type: string, format: uuid }
        - type: object
          required:
            [
              authenticated,
              credential,
              account,
              owned,
              participating,
              connections,
            ]
          properties:
            authenticated: { const: true }
            credential: { const: session }
            account: { $ref: '#/components/schemas/Account' }
            owned:
              type: array
              items: { $ref: '#/components/schemas/Workspace' }
            participating:
              type: array
              items: { $ref: '#/components/schemas/Workspace' }
            connections:
              type: array
              items:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  integratorId: { type: string, format: uuid }
                  integratorName: { type: string }
                  scopes:
                    type: array
                    items: { type: string }
                  createdAt: { type: string, format: date-time }
                  lastUsedAt: { type: [string, 'null'], format: date-time }
                  revokedAt: { type: [string, 'null'], format: date-time }
    TokenRequest:
      type: object
      required: [grant_type, code, code_verifier, client_id, redirect_uri]
      properties:
        grant_type: { const: authorization_code }
        code: { type: string }
        code_verifier: { type: string, minLength: 43, maxLength: 128 }
        client_id: { type: string, format: uuid }
        redirect_uri: { type: string, format: uri }
    TokenResponse:
      type: object
      required: [access_token, token_type, scope]
      properties:
        access_token: { type: string, description: '`vmm_ct_...`' }
        token_type: { const: Bearer }
        scope:
          {
            type: string,
            description: Space-separated scopes from workspaces:read,
            workspaces:write,
            invitations:write,
          }
    Vcon:
      type: object
      description: |
        An unsigned IETF vCon (`draft-ietf-vcon-vcon-core-05`, syntax
        `0.5.0`) with the `verifymymeeting` extension (spec sections 14 and
        15). Typed and validated by `@verifymymeeting/vcon`.
      required: [vcon, uuid, created_at]
      properties:
        vcon: { type: string, example: '0.5.0' }
        uuid: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        subject: { type: string }
        extensions: { type: array, items: { type: string } }
        critical: { type: array, items: { type: string } }
        amended_from: { type: object }
        redacted_from: { type: object }
        parties: { type: array, items: { type: object } }
        dialog: { type: array, items: { type: object } }
        analysis: { type: array, items: { type: object } }
        attachments: { type: array, items: { type: object } }
        sessions: { type: array, items: { type: object } }
        events: { type: array, items: { type: object } }
      additionalProperties: true
    SignedVcon:
      type: object
      description: |
        A signed vCon: JWS General JSON Serialization (RFC 7515 section
        7.2.1) whose `payload` is the base64url of the unsigned JSON (gzipped
        for `cty: application/vcon+gzip`). The protected header carries
        `alg` (`EdDSA`), `kid` (a key in `/.well-known/jwks.json`), `uuid`
        (the payload's uuid) and `cty`.
      required: [payload, signatures]
      properties:
        payload: { type: string, description: base64url }
        signatures:
          type: array
          minItems: 1
          items:
            type: object
            required: [protected, signature]
            properties:
              protected:
                type: string
                description: base64url of the JWS Protected Header JSON
              header:
                type: object
                description: Unprotected header (`x5c`, `x5u`, ...), when any
                additionalProperties: true
              signature: { type: string, description: base64url }
    VconImportInput:
      type: object
      required: [vcon]
      properties:
        vcon:
          oneOf:
            - { $ref: '#/components/schemas/Vcon' }
            - { $ref: '#/components/schemas/SignedVcon' }
        workspaceId:
          type: string
          format: uuid
          description: Commit onto this workspace instead of creating one
        message: { type: string, maxLength: 500 }
    VconImportResult:
      type: object
      required: [workspace, commit, imported]
      properties:
        workspace: { $ref: '#/components/schemas/Workspace' }
        commit: { $ref: '#/components/schemas/CommitSummary' }
        imported:
          type: object
          required: [parties, documents, signature]
          properties:
            parties: { type: integer }
            documents: { type: integer }
            signature:
              type: string
              enum: [verified, unverified, none]
              description: '`verified` when the input was a JWS signed by a service key; `unverified` when signed by an unknown key; `none` when unsigned or email'
    Jwk:
      type: object
      required: [kty, crv, x, kid, use, alg]
      properties:
        kty: { const: OKP }
        crv: { const: Ed25519 }
        x: { type: string, description: base64url of the 32-byte public key }
        kid: { type: string }
        use: { const: sig }
        alg: { const: EdDSA }
    Jwks:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          description: The current service key first, then retired keys
          items: { $ref: '#/components/schemas/Jwk' }
